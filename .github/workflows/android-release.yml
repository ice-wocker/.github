name: Android CI & Release

on:
  push:
    branches: [ main, master, "arena/**" ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Core Tests (Zero-Dependency)
        run: |
          python3 -m unittest discover -s iceTerm/tests

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK build tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $SDK"
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build APK (Zero-Gradle)
        run: |
          cd iceTerm/android
          ./build.sh
          cp iceterm.apk ../../iceterm.apk

      - name: Verify APK Signature & Package
        run: |
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify -v iceterm.apk
          echo "Verified signature for iceterm.apk"

      - name: Commit Prebuilt APK to Workspace
        if: github.ref == 'refs/heads/arena/04f9961e-github'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add iceterm.apk
          git commit -m "build: attach prebuilt release APK binary [skip ci]" || true
          git push origin HEAD:arena/04f9961e-github || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iceterm-release-apk
          path: iceterm.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iceterm.apk
          generate_release_notes: true
          draft: false
